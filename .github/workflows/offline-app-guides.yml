name: Four app offline guides and signed upgrade validation
on:
  push:
    branches: ['feat/offline-app-guides']
    paths: ['guide-release/**', '.github/workflows/offline-app-guides.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore signed candidates and verify their original signatures
        run: |
          python3 - <<'PY'
          import json,urllib.request,hashlib,base64,subprocess,re,os
          from pathlib import Path
          tools=Path(os.environ['ANDROID_HOME'])/'build-tools'
          bt=sorted(tools.iterdir())[-1]
          for r in json.loads(Path('guide-release/metadata.json').read_text()):
            urllib.request.urlretrieve('https://bong40101-prog.github.io/tong-series/'+r['old'],r['old'])
            assert hashlib.sha256(Path(r['old']).read_bytes()).hexdigest()==r['old_sha256']
            patch=Path('/tmp/'+r['file']+'.zst');patch.write_bytes(base64.b64decode(Path('guide-release/'+r['file']+'.zst.b64').read_text()))
            subprocess.run(['zstd','-qdf','--long=27','--patch-from='+r['old'],str(patch),'-o',r['file']],check=True)
            assert hashlib.sha256(Path(r['file']).read_bytes()).hexdigest()==r['sha256']
            cert=subprocess.check_output([str(bt/'apksigner'),'verify','--print-certs',r['file']],text=True)
            assert r['cert'] in cert
            info=subprocess.check_output([str(bt/'aapt'),'dump','badging',r['file']],text=True)
            assert all(value in info for value in re.findall(r"(?:name|versionCode|versionName)='[^']+'",r['package']))
            print('Verified',r['file'])
          PY
      - name: Enable hardware virtualization
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Verify updates and offline manuals on Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 360
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 guide-release/qa-device.py
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-app-guide-verification
          path: evidence/
          retention-days: 7
      - name: Stage validated APKs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TongHome-0.3.16.apk Tongstagram-1.1.7.apk TongSKY-1.0.51.apk TongGlow-1.0.5.apk
          git commit -m 'Stage four signed app updates with offline manuals after Android validation'
          git pull --rebase origin feat/offline-app-guides
          git push origin HEAD:refs/heads/feat/offline-app-guides

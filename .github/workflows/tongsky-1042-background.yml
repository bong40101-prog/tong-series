name: TongSKY 1.0.42 actual background collection
on:
  push:
    branches: ['fix/tongsky-1042']
    paths: ['release1042-background/**', '.github/workflows/tongsky-1042-background.yml']
permissions:
  contents: read
jobs:
  background:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore offline debug-only collector and instrumentation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,json,hashlib
          r=Path('release1042-background');h=json.loads((r/'hashes.json').read_text())
          assert hashlib.sha256(Path('release1042-background/release-base.apk').read_bytes()).hexdigest()==h['release']
          Path('/tmp/debug.zst').write_bytes(base64.b64decode((r/'debug.zst.b64').read_text()))
          Path('/tmp/background-probe.apk').write_bytes(base64.b64decode((r/'probe.apk.b64').read_text()))
          assert hashlib.sha256(Path('/tmp/background-probe.apk').read_bytes()).hexdigest()==h['probe']
          PY
          zstd -qd --long=27 --patch-from=release1042-background/release-base.apk /tmp/debug.zst -o /tmp/debug.apk
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          h=json.loads(Path('release1042-background/hashes.json').read_text())
          assert hashlib.sha256(Path('/tmp/debug.apk').read_bytes()).hexdigest()==h['debug']
          PY
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Verify latest 567 stored route-months against website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/monthly-qa/libs evidence-background
          base64 -d release1041-mobile/framework.tgz.b64 | tar xz -C /tmp/monthly-qa
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import json,base64,hashlib
          patch=json.loads(Path('release1042/classes-update.json').read_text())
          target=Path('/tmp/monthly-qa/classes.jar')
          with ZipFile(target) as z:files={n:z.read(n) for n in z.namelist()}
          for n in patch.get('removed',[]):files.pop(n,None)
          files.update({n:base64.b64decode(v) for n,v in patch['updates'].items()})
          digest=hashlib.sha256(b''.join(n.encode()+b'\0'+hashlib.sha256(files[n]).digest() for n in sorted(files) if n.endswith('.class'))).hexdigest()
          assert digest==patch['fingerprint']
          with ZipFile(target,'w',ZIP_DEFLATED) as z:
              for n,v in files.items():z.writestr(n,v)
          PYCODE
          mkdir -p /tmp/monthly-qa/service/src/test/resources
          base64 -d release1042-background/parity.json.gz.b64 | gzip -d > /tmp/monthly-qa/service/src/test/resources/parity.json
          cp release1042/qa/*.java /tmp/monthly-qa/service/src/test/java/kr/tong/sky/
          mkdir -p /tmp/monthly-qa/service/src/test/resources
          cp release1041-mobile/qa/fixtures/*.json /tmp/monthly-qa/service/src/test/resources/
          cp source1041/tong-sky/tests/framework-region-import/src/test/java/kr/tong/sky/RepeatMarkerPolicyTest.java /tmp/monthly-qa/service/src/test/java/kr/tong/sky/
          curl -fsSL https://dl.google.com/dl/android/maven2/androidx/test/monitor/1.7.2/monitor-1.7.2.aar -o /tmp/monitor.aar
          curl -fsSL https://dl.google.com/dl/android/maven2/androidx/test/espresso/espresso-idling-resource/3.6.1/espresso-idling-resource-3.6.1.aar -o /tmp/espresso.aar
          unzip -p /tmp/monitor.aar classes.jar > /tmp/monthly-qa/libs/monitor.jar
          unzip -p /tmp/espresso.aar classes.jar > /tmp/monthly-qa/libs/espresso.jar
          mvn -B -f /tmp/monthly-qa/service/pom.xml -Dsky.classes.jar=/tmp/monthly-qa/classes.jar -Dandroid.test.libs=/tmp/monthly-qa/libs -Dtongsky.assets="$GITHUB_WORKSPACE/source1041/tong-sky/src/main/assets" -Dtest=ReferenceParityTest test | tee evidence-background/framework.txt
          cp /tmp/monthly-qa/service/target/surefire-reports/TEST-*.xml evidence-background/
      - name: Collect with no Activity task and no network
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash release1042-background/device.sh
      - name: Retain background evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tongsky-1042-background-evidence
          path: evidence-background/
          retention-days: 7

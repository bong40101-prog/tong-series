name: TongSKY mobile detail fix validation
on:
  push:
    branches: ['fix/tongsky-1041-mobile']
    paths: ['release1041-mobile/**', 'source1041/**', '.github/workflows/tongsky-1041-mobile.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore and verify signed candidate and offline probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json,hashlib,base64
          root=Path('release1041-mobile');h=json.loads((root/'hashes.json').read_text())
          old=Path('TongSKY-1.0.41.apk');assert hashlib.sha256(old.read_bytes()).hexdigest()==h['old']
          with ZipFile(old) as z:Path('/tmp/base.dict').write_bytes(b''.join(z.read(n) for n in sorted(z.namelist())))
          Path('/tmp/apk.zst').write_bytes(base64.b64decode((root/'apk.zst.b64').read_text()))
          Path('mobile-probe.apk').write_bytes(base64.b64decode((root/'probe.apk.b64').read_text()))
          assert hashlib.sha256(Path('mobile-probe.apk').read_bytes()).hexdigest()==h['probe']
          PY
          zstd -qd --patch-from=/tmp/base.dict /tmp/apk.zst -o TongSKY-1.0.41-r2.apk
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json,hashlib
          h=json.loads(Path('release1041-mobile/hashes.json').read_text())
          assert hashlib.sha256(Path('TongSKY-1.0.41-r2.apk').read_bytes()).hexdigest()==h['apk']
          with ZipFile('TongSKY-1.0.41-r2.apk') as z:release=z.read('assets/calendar.js')
          with ZipFile('mobile-probe.apk') as z:probe=z.read('assets/candidate.js')
          assert release==probe==Path('source1041/tong-sky/src/main/assets/calendar.js').read_bytes()
          assert hashlib.sha256(release).hexdigest()==h['adapter']
          PY
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --min-sdk-version 33 --verbose --print-certs TongSKY-1.0.41-r2.apk | tee /tmp/signature.txt
          grep -Fq '5ee2986ae413b9dfb87724079b93d83a5dcaabf1d2fe96603418dec50cfe547d' /tmp/signature.txt
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Android 15 mobile lifecycle and non-resetting upgrade
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 360
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash release1041-mobile/qa/device.sh
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tongsky-1041-mobile-verification
          path: |
            evidence/
            TongSKY-1.0.41-r2.apk
          if-no-files-found: error
          retention-days: 7
      - name: Stage validated signed APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TongSKY-1.0.41-r2.apk
          git commit -m 'Stage TongSKY 1.0.41 mobile fix 10143 after Android validation'
          git push origin HEAD:refs/heads/fix/tongsky-1041-mobile

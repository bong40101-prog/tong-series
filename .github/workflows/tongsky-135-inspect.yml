name: Inspect shipped TongSKY 1.0.35 collector
on:
  push:
    branches: ['fix/tongsky-1041-mobile']
    paths: ['.github/workflows/tongsky-135-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Extract shipped original collection source
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          import hashlib,base64,json
          from pathlib import Path
          p=Path('TongSKY-1.0.35.apk')
          with ZipFile(p) as z:
            data=z.read('assets/calendar.js')
            print('BASELINE135_META '+json.dumps({'apkSha256':hashlib.sha256(p.read_bytes()).hexdigest(),'calendarSha256':hashlib.sha256(data).hexdigest(),'calendarBytes':len(data)}))
            print('BASELINE135_SOURCE '+base64.b64encode(data).decode())
          PY

name: TongSKY 1.0.41 update validation
on:
  push:
    branches: [release/tongsky-1041]
    paths: ['release-1041/**', '.github/workflows/tongsky-1041-validate.yml']
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify signed update independently with Android tools
        run: |
          set -euo pipefail
          echo '18847120cb30a35f615b9a943a39a205ed8fd20700c376eb849337ab639ebdbc  TongSKY-1.0.41.apk' | sha256sum -c -
          python3 release-1041/restore.py
          t=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1); b=$(dirname "$t")
          "$t" verify --verbose --print-certs TongSKY-1.0.41.apk | tee /tmp/tong-cert
          grep -F 5ee2986ae413b9dfb87724079b93d83a5dcaabf1d2fe96603418dec50cfe547d /tmp/tong-cert
          "$b/aapt" dump badging TongSKY-1.0.41.apk | grep -F "package: name='kr.tong.sky' versionCode='10142' versionName='1.0.41'"
          "$b/zipalign" -c 4 TongSKY-1.0.41.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash release-1041/device.sh

name: Update Korean Google trending searches
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/google-trends.yml]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tong-series-google-trends
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Collect official Google Korea trends
        run: python3 scripts/update-trends.py
      - name: Save latest successful data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trends.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Korean Google trending searches'
          for attempt in 1 2 3; do
            git pull --rebase origin gh-pages
            if git push origin HEAD:gh-pages; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish refreshed homepage
        id: deployment
        uses: actions/deploy-pages@v4

name: TongSKY 132 final visible-card format fallback functional probe
on:
  push:
    branches: ['audit/tongsky-132-af-visible']
    paths: ['audit132-af-visible-device/**', '.github/workflows/tongsky132-af-visible-device.yml']
permissions:
  contents: read
jobs:
  device:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            scope: functional
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Android offline probes
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: PROBE_SCOPE=${{ matrix.scope }} bash audit132-af-visible-device/run-device.sh
      - name: Save emulator logs and probe results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tongsky132-af-visible-api${{ matrix.api }}-${{ matrix.scope }}
          path: audit132-af-visible-device/reports/
          retention-days: 7
